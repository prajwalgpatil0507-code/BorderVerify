# Render Blueprint — deploys BorderVerify as a SINGLE service that serves both
# the FastAPI backend and the frontend SPA (unique public URL; the API, document
# upload/verification, result pages, history, and /api/health all live there).
#
# Secret values (SECRET_KEY, MONGODB_URI, GEMINI_API_KEY) are NOT stored here:
#   - SECRET_KEY is auto-generated by Render (generateValue).
#   - MONGODB_URI and GEMINI_API_KEY are marked `sync: false`, so you set them
#     manually in the Render service dashboard (Environment tab) after deploy.
#
# To persist uploaded documents + verification history across restarts, add a
# persistent disk (paid plan) and set DATA_DIR to its mount path, e.g.:
#     disk:
#       name: borderverify-data
#       mountPath: /app/data
#       sizeGB: 1
#   envVars:
#     - key: DATA_DIR
#       value: /app/data
#
# Without a disk the app runs on transient filesystem (uploads/results reset on
# restart) but still functions; the committed sample assets are baked into the
# image so demo/synthetic cases always work.

services:
  - type: web
    name: borderverify
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: API_PREFIX
        value: /api
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: OFFLINE_MODE
        value: "true"
      # The static GitHub Pages frontend calls this API cross-origin; allow that
      # exact origin (NOT "*", which conflicts with allow_credentials). The
      # Render-hosted copy of the frontend is same-origin, so it needs no CORS.
      - key: CORS_ORIGINS
        value: "https://prajwalgpatil0507-code.github.io"
      - key: MONGODB_DATABASE
        value: borderverify
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: MAX_UPLOAD_MB
        value: "15"
      # Secrets — set these in the Render dashboard (do NOT commit real values).
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
